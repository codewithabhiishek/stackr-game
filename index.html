<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05080f" />
    <meta name="description" content="A fast-paced 3D isometric tower stacking arcade game with combo multipliers and procedural synth audio." />
    <meta property="og:title" content="STACKR — One-Tap 3D Tower Stacking Game" />
    <meta property="og:description" content="A fast-paced 3D isometric tower stacking arcade game with combo multipliers and procedural synth audio." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stackr-game-ten.vercel.app" />
    <meta property="og:image" content="https://stackr-game-ten.vercel.app/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STACKR" />
    <meta name="twitter:description" content="A fast-paced 3D isometric tower stacking arcade game with combo multipliers and procedural synth audio." />
    <meta name="twitter:image" content="https://stackr-game-ten.vercel.app/og-image.jpg" />
    <title>STACKR</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='19' width='24' height='9' fill='%23ff5e5b'/%3E%3Crect x='7' y='10' width='18' height='8' fill='%23ffc857'/%3E%3Crect x='10' y='2' width='12' height='7' fill='%2353d8ff'/%3E%3C/svg%3E"
    />
    <!-- Fonts load async + non-blocking so the game never waits on the network -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap"
      />
    </noscript>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05080f;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant fallback: replaced the moment React mounts -->
      <div
        id="boot-fallback"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: #05080f;
          font-family: ui-sans-serif, system-ui, sans-serif;
          cursor: default;
        "
      >
        <div
          style="
            width: 34px;
            height: 34px;
            border: 4px solid #1d3048;
            border-top-color: #ffc857;
            border-radius: 50%;
            animation: bootspin 0.8s linear infinite;
          "
        ></div>
        <div
          id="boot-text"
          style="
            color: #cfe6ff;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.35em;
            text-align: center;
            padding: 0 16px;
          "
        >
          STACKR
        </div>
        <style>
          @keyframes bootspin {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
      <script>
        // If the app hasn't mounted after a few seconds (e.g. a stale cached
        // bundle 404'd), give the user something actionable instead of a
        // frozen spinner.
        window.setTimeout(function () {
          var fb = document.getElementById("boot-fallback");
          var txt = document.getElementById("boot-text");
          if (fb && txt && document.getElementById("root") && fb.isConnected) {
            txt.textContent = "STILL LOADING — TAP TO RELOAD";
            fb.style.cursor = "pointer";
            fb.addEventListener("click", function () {
              window.location.reload();
            });
          }
        }, 4000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
